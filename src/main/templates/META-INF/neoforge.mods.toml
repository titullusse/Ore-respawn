# This is a NeoForge mod file. It contains the data relating to the loading of mods.
# The overall format is standard TOML format, v0.5.0.
# See https://github.com/toml-lang/toml for the format spec.

modLoader="javafml" #mandatory
loaderVersion="${loader_version_range}" #mandatory
license="${mod_license}"
issueTrackerURL="https://github.com/titullusse/ore-respawn/issues" #optional

[[mods]] #mandatory
modId="${mod_id}" #mandatory
version="${mod_version}" #mandatory
displayName="${mod_name}" #mandatory
authors="${mod_authors}" #optional
description='''${mod_description}''' #mandatory

# OreRespawn only runs server-side logic (block breaking, world save data, ticking).
# The mod class itself is annotated with @Mod(dist = Dist.DEDICATED_SERVER), so it
# never loads on a physical client; this dependency side declaration documents that.
[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="${neo_version_range}"
    ordering="NONE"
    side="SERVER"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="SERVER"
